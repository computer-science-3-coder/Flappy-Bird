<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#87d8f4">
    <title>Flappy Bird</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: #e9f8fc;
        color: #17364b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(ellipse at 50% 0%, #fff 0%, transparent 58%),
          linear-gradient(180deg, #d9f4fb 0%, #f5fbf8 100%);
      }

      main {
        width: min(100%, 480px);
        text-align: center;
      }

      h1 {
        margin: 0 0 5px;
        color: #14516a;
        font-size: clamp(2rem, 8vw, 2.8rem);
        letter-spacing: 0.04em;
        text-shadow: 0 2px 0 #fff;
      }

      .tagline {
        margin: 0 0 18px;
        color: #587688;
        font-size: 0.98rem;
      }

      .game-frame {
        position: relative;
        overflow: hidden;
        width: 100%;
        border: 5px solid #fff;
        border-radius: 22px;
        background: #88d9f4;
        box-shadow: 0 18px 44px #24718b2b, 0 3px 8px #24718b1a;
        touch-action: manipulation;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 4;
        cursor: pointer;
        touch-action: manipulation;
      }

      .instructions {
        margin: 16px 0 0;
        color: #49697b;
        font-size: 0.95rem;
        line-height: 1.55;
      }

      .instructions strong {
        color: #19536b;
      }

      #restart {
        display: none;
        margin: 16px auto 0;
        padding: 11px 22px;
        border: 0;
        border-radius: 999px;
        background: #f5a623;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 4px 0 #cf7e12;
        transition: transform 120ms ease, filter 120ms ease;
      }

      #restart:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      #restart:active {
        box-shadow: 0 2px 0 #cf7e12;
        transform: translateY(2px);
      }

      #restart:focus-visible {
        outline: 3px solid #14516a;
        outline-offset: 4px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Flappy Bird</h1>
      <p class="tagline">A little flap, a big adventure.</p>
      <div class="game-frame">
        <canvas id="game" width="480" height="640" aria-label="Flappy Bird game. Press Space or click to flap.">
          Your browser does not support the canvas element.
        </canvas>
      </div>
      <p class="instructions"><strong>Space</strong> or <strong>click / tap</strong> to flap<br>Fly through 20 pipes to win. Avoid the pipes, ceiling, and ground!</p>
      <button id="restart" type="button">Play again</button>
      <p id="game-status" class="visually-hidden" aria-live="polite"></p>
    </main>

    <script>
      (() => {
        "use strict";

        const canvas = document.querySelector("#game");
        const context = canvas.getContext("2d");
        const restartButton = document.querySelector("#restart");
        const statusText = document.querySelector("#game-status");
        const width = canvas.width;
        const height = canvas.height;
        const groundHeight = 58;
        const groundY = height - groundHeight;
        const targetScore = 20;
        const pipeWidth = 76;
        const pipeGap = 178;
        const pipeSpeed = 190;
        const spawnEvery = 1.65;
        const gravity = 1450;
        const flapVelocity = -440;
        const birdRadius = 16;
        const birdX = 122;

        let state = "ready";
        let score = 0;
        let birdY = height * 0.44;
        let birdVelocity = 0;
        let pipes = [];
        let spawnTimer = 0;
        let lastFrame = 0;
        let worldTime = 0;

        function resetGame() {
          state = "ready";
          score = 0;
          birdY = height * 0.44;
          birdVelocity = 0;
          pipes = [];
          spawnTimer = 0;
          lastFrame = 0;
          restartButton.style.display = "none";
          statusText.textContent = "Ready. Press Space or click to start.";
          draw();
        }

        function endGame(result) {
          state = result;
          restartButton.style.display = "block";
          statusText.textContent = result === "won"
            ? `You won with ${score} points!`
            : `Game over. Your final score is ${score}.`;
        }

        function flap() {
          if (state === "ready") {
            state = "playing";
            statusText.textContent = "Game started.";
          }
          if (state !== "playing") return;
          birdVelocity = flapVelocity;
        }

        function addPipe() {
          const margin = 105;
          const openingCenter = margin + Math.random() * (groundY - pipeGap - margin * 2) + pipeGap / 2;
          pipes.push({ x: width + 8, openingCenter, scored: false });
        }

        function circleHitsRect(cx, cy, radius, x, y, w, h) {
          const nearestX = Math.max(x, Math.min(cx, x + w));
          const nearestY = Math.max(y, Math.min(cy, y + h));
          const dx = cx - nearestX;
          const dy = cy - nearestY;
          return dx * dx + dy * dy < radius * radius;
        }

        function update(delta) {
          if (state !== "playing") return;

          birdVelocity += gravity * delta;
          birdY += birdVelocity * delta;
          spawnTimer += delta;
          if (spawnTimer >= spawnEvery) {
            spawnTimer -= spawnEvery;
            addPipe();
          }

          for (const pipe of pipes) {
            pipe.x -= pipeSpeed * delta;
            const openingTop = pipe.openingCenter - pipeGap / 2;
            const openingBottom = pipe.openingCenter + pipeGap / 2;
            if (
              circleHitsRect(birdX, birdY, birdRadius, pipe.x, 0, pipeWidth, openingTop) ||
              circleHitsRect(birdX, birdY, birdRadius, pipe.x, openingBottom, pipeWidth, groundY - openingBottom)
            ) {
              endGame("over");
              return;
            }
            if (!pipe.scored && pipe.x + pipeWidth < birdX) {
              pipe.scored = true;
              score += 1;
              statusText.textContent = `Score: ${score}.`;
              if (score >= targetScore) {
                endGame("won");
                return;
              }
            }
          }
          pipes = pipes.filter((pipe) => pipe.x + pipeWidth > -10);

          if (birdY - birdRadius <= 0 || birdY + birdRadius >= groundY) {
            endGame("over");
          }
        }

        function roundedRect(x, y, w, h, radius) {
          context.beginPath();
          context.roundRect(x, y, w, h, radius);
          context.fill();
        }

        function drawCloud(x, y, scale) {
          context.fillStyle = "rgba(255, 255, 255, 0.72)";
          context.beginPath();
          context.arc(x, y, 18 * scale, 0, Math.PI * 2);
          context.arc(x + 22 * scale, y - 10 * scale, 24 * scale, 0, Math.PI * 2);
          context.arc(x + 48 * scale, y, 18 * scale, 0, Math.PI * 2);
          context.fill();
          context.fillRect(x - 1 * scale, y - 2 * scale, 51 * scale, 20 * scale);
        }

        function drawPipe(pipe) {
          const openingTop = pipe.openingCenter - pipeGap / 2;
          const openingBottom = pipe.openingCenter + pipeGap / 2;
          const gradient = context.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
          gradient.addColorStop(0, "#35a943");
          gradient.addColorStop(0.35, "#69d354");
          gradient.addColorStop(1, "#278b3b");
          context.fillStyle = gradient;
          context.strokeStyle = "#237a38";
          context.lineWidth = 3;

          context.fillRect(pipe.x + 5, 0, pipeWidth - 10, openingTop - 18);
          context.strokeRect(pipe.x + 5, -2, pipeWidth - 10, openingTop - 16);
          roundedRect(pipe.x, openingTop - 20, pipeWidth, 22, 5);
          context.strokeRect(pipe.x, openingTop - 20, pipeWidth, 22);

          context.fillRect(pipe.x + 5, openingBottom + 18, pipeWidth - 10, groundY - openingBottom - 18);
          context.strokeRect(pipe.x + 5, openingBottom + 18, pipeWidth - 10, groundY - openingBottom - 16);
          roundedRect(pipe.x, openingBottom - 2, pipeWidth, 22, 5);
          context.strokeRect(pipe.x, openingBottom - 2, pipeWidth, 22);

          context.fillStyle = "rgba(255, 255, 255, 0.2)";
          context.fillRect(pipe.x + 12, 0, 8, Math.max(0, openingTop - 24));
          context.fillRect(pipe.x + 12, openingBottom + 24, 8, Math.max(0, groundY - openingBottom - 24));
        }

        function drawBird() {
          const tilt = state === "playing"
            ? Math.max(-0.45, Math.min(0.9, birdVelocity / 650))
            : 0;
          context.save();
          context.translate(birdX, birdY);
          context.rotate(tilt);

          context.fillStyle = "#ef9f24";
          context.beginPath();
          context.ellipse(-3, 5, 12, 8, -0.25, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = "#ffd344";
          context.beginPath();
          context.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = "#fff4d2";
          context.beginPath();
          context.ellipse(5, 4, 9, 6, 0.1, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = "#fff";
          context.beginPath();
          context.arc(8, -6, 5, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = "#17364b";
          context.beginPath();
          context.arc(10, -6, 2, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = "#f07835";
          context.beginPath();
          context.moveTo(14, 0);
          context.lineTo(27, 4);
          context.lineTo(14, 8);
          context.closePath();
          context.fill();
          context.restore();
        }

        function drawOverlay(title, subtitle) {
          context.fillStyle = "rgba(17, 54, 72, 0.26)";
          context.fillRect(0, 0, width, groundY);
          context.fillStyle = "#fff";
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.font = "800 38px Trebuchet MS, sans-serif";
          context.shadowColor = "rgba(20, 66, 83, 0.35)";
          context.shadowBlur = 5;
          context.fillText(title, width / 2, height * 0.4);
          context.shadowBlur = 0;
          context.font = "600 17px Trebuchet MS, sans-serif";
          context.fillText(subtitle, width / 2, height * 0.4 + 42);
          context.shadowBlur = 0;
        }

        function draw() {
          const sky = context.createLinearGradient(0, 0, 0, groundY);
          sky.addColorStop(0, "#78d2f2");
          sky.addColorStop(1, "#d5f3ee");
          context.fillStyle = sky;
          context.fillRect(0, 0, width, height);

          drawCloud(58 - (worldTime * 13) % 600, 118, 0.8);
          drawCloud(310 - (worldTime * 9) % 600, 205, 0.62);
          drawCloud(430 - (worldTime * 11) % 650, 83, 0.55);

          context.fillStyle = "#9cdda5";
          context.beginPath();
          context.moveTo(0, groundY - 75);
          context.quadraticCurveTo(120, groundY - 150, 240, groundY - 70);
          context.quadraticCurveTo(365, groundY - 152, width, groundY - 62);
          context.lineTo(width, groundY);
          context.lineTo(0, groundY);
          context.fill();

          for (const pipe of pipes) drawPipe(pipe);
          drawBird();

          context.fillStyle = "#78c950";
          context.fillRect(0, groundY - 9, width, 9);
          context.fillStyle = "#e9c879";
          context.fillRect(0, groundY, width, groundHeight);
          context.fillStyle = "#d4ad5f";
          for (let x = -24 + (worldTime * pipeSpeed) % 48; x < width; x += 48) {
            context.fillRect(x, groundY + 18, 24, 5);
            context.fillRect(x + 18, groundY + 37, 24, 5);
          }

          context.fillStyle = "rgba(255, 255, 255, 0.92)";
          roundedRect(16, 16, 104, 48, 16);
          context.fillStyle = "#174b5f";
          context.textAlign = "left";
          context.textBaseline = "middle";
          context.font = "700 14px Trebuchet MS, sans-serif";
          context.fillText("SCORE", 28, 32);
          context.font = "800 22px Trebuchet MS, sans-serif";
          context.fillText(String(score).padStart(2, "0"), 28, 51);

          if (state === "ready") drawOverlay("Ready?", "Click or press Space to flap");
          if (state === "over") drawOverlay("Game Over", `Final score: ${score}`);
          if (state === "won") drawOverlay("You Win!", "Amazing flying — you reached 20!");
        }

        function frame(timestamp) {
          if (!lastFrame) lastFrame = timestamp;
          const delta = Math.min((timestamp - lastFrame) / 1000, 0.035);
          lastFrame = timestamp;
          worldTime += delta;
          update(delta);
          draw();
          requestAnimationFrame(frame);
        }

        canvas.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          if (state === "over" || state === "won") return;
          flap();
        });

        window.addEventListener("keydown", (event) => {
          if (event.code === "Space" || event.code === "ArrowUp") {
            event.preventDefault();
            if (state === "over" || state === "won") return;
            flap();
          } else if ((event.code === "KeyR" || event.code === "Enter") && (state === "over" || state === "won")) {
            resetGame();
          }
        });

        restartButton.addEventListener("click", resetGame);
        resetGame();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
